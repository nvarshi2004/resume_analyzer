<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Gap Analyzer - Dark Mode</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>Resume Gap Analyzer</h1>
            <p>Optimize your resume for applicant tracking systems.</p>
        </header>

        <div class="input-section">
            <div class="input-group">
                <label for="job-description">Job Description</label>
                <textarea id="job-description" placeholder="Paste the job description here..."></textarea>
            </div>
            
            <div class="input-group">
                <div class="label-with-action">
                    <label for="resume">Your Resume</label>
                    <div class="upload-wrapper">
                        <input type="file" id="resume-file" accept=".pdf,.doc,.docx" class="hidden-input" />
                        <label for="resume-file" class="btn outline-btn" id="upload-label">📁 Upload File</label>
                    </div>
                </div>
                <div id="upload-feedback" class="feedback-text hidden"></div>
                <textarea id="resume" placeholder="Paste your resume content or upload a file..."></textarea>
            </div>
        </div>

        <button id="analyze-btn" class="btn primary-btn">
            <span class="btn-text">Analyze Resume</span>
            <div class="loader hidden"></div>
        </button>

        <section id="results-section" class="results-section hidden">
            <div class="results-header">
                <h2>Analysis Results</h2>
                <button id="copy-btn" class="btn secondary-btn">Copy Results</button>
            </div>
            
            <div class="cards-grid top-cards">
                <div class="card ats-card">
                    <div class="ats-header">
                        <h3>ATS Engine Score</h3>
                        <div class="pill" id="ats-indicator"></div>
                    </div>
                    <div class="score-display">
                        <span class="big-score" id="ats-score-text">0</span><span class="score-max">/100</span>
                    </div>
                    
                    <div class="breakdown-grid">
                        <div class="bd-item">
                            <span>Keywords</span>
                            <strong id="bd-keywords">0%</strong>
                        </div>
                        <div class="bd-item">
                            <span>Skills</span>
                            <strong id="bd-skills">0%</strong>
                        </div>
                        <div class="bd-item">
                            <span>Metrics</span>
                            <strong id="bd-metrics">0%</strong>
                        </div>
                        <div class="bd-item">
                            <span>Quality</span>
                            <strong id="bd-content">0%</strong>
                        </div>
                    </div>
                </div>

                <div class="card score-card">
                    <h3>Match Readability</h3>
                    <div class="score-circle">
                        <svg viewBox="0 0 36 36" class="circular-chart">
                            <path class="circle-bg"
                            d="M18 2.0845
                            a 15.9155 15.9155 0 0 1 0 31.831
                            a 15.9155 15.9155 0 0 1 0 -31.831"
                            />
                            <path class="circle" id="score-circle"
                            stroke-dasharray="0, 100"
                            d="M18 2.0845
                            a 15.9155 15.9155 0 0 1 0 31.831
                            a 15.9155 15.9155 0 0 1 0 -31.831"
                            />
                            <text x="18" y="20.35" class="percentage" id="score-text">0%</text>
                        </svg>
                    </div>
                    <p id="fit-label" class="fit-label">-</p>
                </div>
            </div>

            <div class="cards-grid bottom-cards">
                <div class="card weaknesses-card">
                    <h3>Gaps & Weaknesses</h3>
                    <ul id="weaknesses-list" class="styled-list">
                        <!-- Populated by JS -->
                    </ul>
                </div>

                <div class="card suggestions-card">
                    <h3>Actionable Suggestions</h3>
                    <ul id="suggestions-list" class="styled-list">
                        <!-- Populated by JS -->
                    </ul>
                </div>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
